<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8 -Calcular o valor de um financiamento</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<!--
Crie um formulário HTML com três campos de texto: valor do bem, número de
parcelas e valor da entrada. Adicione um botão com o texto “Calcular Parcelas”
e utilize addEventListener para associar a ação ao botão. A função deverá
calcular o valor de cada parcela e exibir em um alert().
-->

<body>
    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>
    <main class="main-content">
        <h2>Exercicio 8 -Calcular o valor de um financiamento</h2>
        <div class="form-columns">
            <div class="form-column-item">
                <div class="form-group">
                    <label for="valor_do_bem">Valor do bem</label>
                    <input type="text" id="valor_do_bem" placeholder="Digite o valor do bem aqui...">
                </div>
                <div class="form-group">
                    <label for="numero_parcelas">Número de parcelas</label>
                    <input type="text" id="numero_parcelas" placeholder="Digite o numero de parcelas aqui...">
                </div>
                <div class="form-group">
                    <label for="valor_entrada">Valor de entrada</label>
                    <input type="text" id="valor_entrada" placeholder="Digite o valor de entrada aqui...">
                </div>
                </div>
            </div>
        </div>
        <button type="submit" id="btn_calcular_parcelas" class="btn success">Calcular Parcelas</button>
    </main>
    <script>

    const valorDoBem = document.getElementById("valor_do_bem")
    const NumeroParcelas = document.getElementById("numero_parcelas")
    const valorEntrada = document.getElementById("valor_entrada")
    const btnCalcularParcelas = document.getElementById("btn_calcular_parcelas")
        
    btnCalcularParcelas.addEventListener("click", () => {
        const valorTotal = valorDoBem.value - valorEntrada.value
        const valorParcela = valorTotal/NumeroParcelas.value
        alert(`Valor total: R$ ${valorTotal.toFixed(2)}. \nQuantidade de parcelas: ${NumeroParcelas.value}. \nO valor de cada parcela será R$ ${valorParcela.toFixed(2)}.`)
    })
        
    </script>
</body>

</html>
