<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3 - Capturando informações de um livro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<!--
Crie um formulário HTML com os seguintes campos: um para digitar o
título do livro, um outro para digitar o ano do livro, um outro para digitar a
edição e outro para digitar o nome do autor. Adicione um botão escrito
“Mostrar Livro”. Utilize o addEventListener para adicionar o evento click
ao botão. A função chamada no clique deve capturar os valores digitados
nos inputs e exibi-los em um alert() com quebra de linha entre cada
informação.
-->

<body>
    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>
    <main class="main-content">
        <h2>Exercicio 3 - Capturando informações de um livro</h2>
        <div class="form-columns">
            <div class="form-column-item">
                <div class="form-group">
                    <label for="titulo">Título do livro</label>
                    <input type="text" id="titulo" placeholder="Digite o nome do produto aqui...">
                </div>
                <div class="form-group">
                    <label for="ano">Ano</label>
                    <input type="text" id="ano" placeholder="Digite o ano aqui...">
                </div>
            </div>
            <div class="form-column-item">
                <div class="form-group">
                    <label for="edicao">Edição</label>
                    <input type="text" id="edicao" placeholder="Digite a edição aqui...">
                </div>
                <div class="form-group">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" placeholder="Digite o nome do autor aqui...">
                </div>
            </div>
        </div>
        <button type="submit" id="btn_mostrar" class="btn success">Mostrar Livro</button>
    </main>
    <script>
        const btnMostrar = document.getElementById("btn_mostrar")
        btnMostrar.addEventListener("click", () => {
            const titulo = document.querySelector("#titulo").value
            const ano = document.querySelector("#ano").value
            const edicao = document.querySelector("#edicao").value
            const autor = document.querySelector("#autor").value

            alert(`Titulo do Livro: ${titulo}. \nPreço: ${ano}. \nQuantidade em estoque: ${edicao}. \nAutor: ${autor}.`)
        })
    </script>
</body>

</html>
