<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1 - Pegando informações da cidade</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<!--
Crie um formulário HTML com os seguintes campos: nome da cidade,
nome do estado e quantidade de habitantes. Adicione um botão com o
evento onclick que chame uma função JavaScript com o nome
“mostrarCidade”. A função deverá capturar o valor de cada campo do
formulário e exibi-los em um alert() com as informações concatenadas.
O conteúdo do alert() deve ser formatado para ter uma quebra de linha
para cada informação
-->

<body>
    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>
    <main class="main-content">
        <h2>Exercicio 1 - Pegando informações da cidade</h2>
        <div class="form-columns">
            <div class="form-column-item">
                <div class="form-group">
                    <label for="nome_cidade">Nome da cidade</label>
                    <input type="text" id="nome_cidade" placeholder="Digite o nome da cidade aqui...">
                </div>
                <div class="form-group">
                    <label for="nome_estado">Nome do Estado</label>
                    <input type="text" id="nome_estado" placeholder="Digite o nome do estado aqui...">
                </div>
            </div>
            <div class="form-column-item">
                <div class="form-group">
                    <label for="quantidade_habitantes">Quantidade de habitantes</label>
                    <input type="text" id="quantidade_habitantes" placeholder="Digite a quantidade de habitantes aqui...">
                </div>
            </div>
        </div>
        <button type="submit" class="btn success" onclick="mostrarCidade()">Mostrar Cidade</button>
    </main>
    <script>
        
        function mostrarCidade() {
            const cidade = document.querySelector("#nome_cidade").value
            const estado = document.querySelector("#nome_estado").value
            const quantidadeHabitantes = document.querySelector("#quantidade_habitantes").value

            alert(`Cidade: ${cidade}. \nEstado: ${estado}. \nQuantidade de habitantes: ${quantidadeHabitantes}.`)
        }
    </script>
</body>

</html>
