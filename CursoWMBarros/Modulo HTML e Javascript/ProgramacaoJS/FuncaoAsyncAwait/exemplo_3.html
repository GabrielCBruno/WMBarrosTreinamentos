<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 3 - For</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 3 - For</h2>
        <button type="submit" id="btn_realizar_pedido" class="btn success" onclick="fazerPedido()">Realizar Pedido</button>
        <p id="msg"></p>
    </main>
    <script>

        const msg = document.getElementById("msg")
        
        async function processarPedido() {

            msg.innerHTML += `Iniciando os preparos. <br>`
            await setTimeout(() => {
                msg.innerHTML += `Comida finalizada, pode entregar.<br>` 
            }, 5000) //milisegundos (5000 = 5 segundos) - função async

        }

        async function iniciarPedido() {
            msg.innerHTML += `Cliente pode fazer qualquer coisa.<br>`
            await processarPedido() // await = obriga a função/processamento a ser finalizado antes de seguir o código. Se tiver uma função com await a função externa tem que ser async.
            msg.innerHTML += `Pedido pronto, chama o cliente.<br>`
            //async = função/processamento que é executada em paralelo com o restante do código.
        }

        function fazerPedido() {
            msg.innerHTML = `Fazendo o pedido.<br>`
            iniciarPedido()
            msg.innerHTML += `Enviando o pedido para a cozinha.<br>`
        }

    </script>
</body>

</html>
