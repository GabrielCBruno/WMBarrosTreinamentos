<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 3 - For</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 3 - For</h2>
        <button type="submit" id="btn_realizar_pedido" class="btn success" onclick="fazerPedido()">Realizar Pedido</button>
        <p id="msg"></p>
    </main>
    <script>

        
        /*
            1- Passo: Fazendo o pedido.
            2- Passo: Enviando o pedido para a cozinha.
            3- Passo: Iniciando os preparos.
            4- Passo: Cliente pode fazer qualquer coisa.
            5- Passo: Comida finalizada, pode entregar.
            6- Passo: Pedido pronto, chama o cliente.         
       */

        const msg = document.getElementById("msg")
        
        async function processarPedido() {

            msg.innerHTML += `3 Iniciando os preparos. <br>`
            setTimeout(() => {
                msg.innerHTML += `6 Comida finalizada, pode entregar.<br>` 
            }, 5000) 
        }

        async function iniciarPedido() {
            msg.innerHTML += `2 Enviando o pedido para a cozinha.<br>`
            await processarPedido() 
            msg.innerHTML += `5 Pedido pronto, chama o cliente.<br>`
        }

        function fazerPedido() {
            msg.innerHTML = `1 Fazendo o pedido.<br>`
            iniciarPedido() 
            msg.innerHTML += `4 Cliente pode fazer qualquer coisa.<br>`
        }

        // await = obriga a função/processamento a ser finalizado antes de seguir o código. Se tiver uma função com await a função externa tem que ser async.

        //async = função/processamento que é executada em paralelo com o restante do código.

    </script>
</body>

</html>
