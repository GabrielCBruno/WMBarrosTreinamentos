<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 - Operadores Relacionais</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 1 - Operadores Relacionais</h2>
        <div class="form-group">
            <label for="nome_completo">Nome Completo</label>
            <input type="text" id="nome_completo" placeholder="Digite o seu nome aqui...">
        </div>
        <div class="form-group">
            <label for="email_usuario">Email</label>
            <input type="text" id="email_usuario" placeholder="Digite o seu email aqui...">
        </div>
        
        <button type="submit" id="btn_mostrar" class="btn success">Mostrar</button>
    </main>
    <script>

        const btnMostrar = document.getElementById("btn_mostrar")

        btnMostrar.addEventListener("click", () => {
            alert("Clicou no botao do evento")
        })

        function mostrarCampoDigitado() {
            const nomeCompleto = document.querySelector("#nome_completo").value
            const email = document.querySelector("#email_usuario").value
            alert(`Nome completo: ${nomeCompleto} \nEmail: ${email}`)
        }

    </script>
</body>

</html>
