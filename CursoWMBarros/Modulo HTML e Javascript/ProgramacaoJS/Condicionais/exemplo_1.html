<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 - Operadores Relacionais</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 1 - Operadores Relacionais</h2>
        <div class="form-group">
            <label for="nome_completo">Nome Completo</label>
            <input type="text" id="nome_completo" placeholder="Digite o seu nome aqui...">
        </div>
        <div class="form-group">
            <label for="idade_usuario">Idade</label>
            <input type="text" id="idade_usuario" placeholder="Digite a sua idade aqui...">
        </div>
        <p id="msg"></p>
        <button type="submit" id="btn_verificar" class="btn success">Mostrar</button>
    </main>
    <script>

        const nomeCompleto = document.getElementById("nome_completo")
        const idade = document.getElementById("idade_usuario")
        const btnVerificar = document.getElementById("btn_verificar")

        btnVerificar.addEventListener("click", () => {

             if (nomeCompleto.value.trim() == "") {
                alert("Preencha o campo NOME!!!")
                nomeCompleto.value = ""
                nomeCompleto.focus()
            }else if (idade.value.trim() == "") {
                alert("Preencha o campo EMAIL!!!")
                idade.value = ""
                idade.focus()
            }else if (isNaN(idade.value.trim())) {
                idade.value = ""
                idade.focus()
                alert("Preencher a idade com somente números!!!")
            }else {
                alert("Campos validados corretamente!!!")
            }
        })

        

    </script>
</body>

</html>
