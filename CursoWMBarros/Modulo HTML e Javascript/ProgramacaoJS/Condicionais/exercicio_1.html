<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1 - Comparar duas idades</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!--• Crie um formulário HTML com dois inputs de texto: um para digitar o nome e o
    outro a idade. Repita esses campos para a digitação de uma outra pessoa e
    um botão “Comparar Idades”. Utilize addEventListener para associar a ação ao
    botão. A função deverá verificar qual idade é maior e exibir em um paragrafo o
    nome e a idade da pessoa mais velha. Se ambas tiverem a mesma idade,
    mostrar a mensagem: Ambas tem a mesma idade.
    -->

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exercicio 1 - Comparar duas idades</h2>
        <h3>Pessoa 1</h3>
        <div class="form-group">
            <label for="nome_pessoa_1">Nome</label>
            <input type="text" id="nome_pessoa_1" placeholder="Digite o seu nome aqui...">
        </div>
        <div class="form-group">
            <label for="idade_pessoa_1">Idade</label>
            <input type="text" id="idade_pessoa_1" placeholder="Digite a idade aqui...">
        </div>
        <h3>Pessoa 2</h3>
        <div class="form-group">
            <label for="nome_pessoa_2">Nome</label>
            <input type="text" id="nome_pessoa_2" placeholder="Digite o seu nome aqui...">
        </div>
        <div class="form-group">
            <label for="idade_pessoa_2">Idade</label>
            <input type="text" id="idade_pessoa_2" placeholder="Digite a idade aqui...">
        </div>
        <button type="submit" id="btn_comparar_idades" class="btn success">Comparar Idades</button>
        <p id="conteudo"></p>
    </main>
    <script>
        const mensagem = document.getElementById("conteudo")
        const btnCompararIdades = document.getElementById("btn_comparar_idades")

        btnCompararIdades.addEventListener("click", () => {
            const CampoNomePessoa1 = document.getElementById("nome_pessoa_1")
            const CampoIdadePessoa1 = document.getElementById("idade_pessoa_1")
            const CampoNomePessoa2 = document.getElementById("nome_pessoa_2")
            const CampoIdadePessoa2 = document.getElementById("idade_pessoa_2")
            let msg;

            if (CampoNomePessoa1.value.trim() == "") {
                alert(`Campo NOME da Pessoa 1 está vázio!!! Por favor preencher o campo corretamente.`)
                CampoNomePessoa1.value = ""
                CampoNomePessoa1.focus()
                exit
            }else if (CampoIdadePessoa1.value.trim() == "") {
                alert(`Campo IDADE da Pessoa 1 está vázio!!! Por favor preencher o campo corretamente.`)
                CampoIdadePessoa1.value = ""
                CampoIdadePessoa1.focus()
                exit
            }else if (isNaN(CampoIdadePessoa1.value.trim())) {
                alert(`Campo IDADE da Pessoa 1 está com um valor que não é númerico!!! Por favor preencher o campo corretamente.`)
                CampoIdadePessoa1.value = ""
                CampoIdadePessoa1.focus()
                exit
            }else if (CampoIdadePessoa1.value.trim() <= 0) {
                alert(`Campo IDADE da Pessoa 1 está com um valor igual ou menor que zero!!! Por favor preencher o campo corretamente.`)
                CampoIdadePessoa1.value = ""
                CampoIdadePessoa1.focus()
                exit
            }else if (CampoNomePessoa2.value.trim() == "") {
                alert(`Campo NOME da Pessoa 2 está vázio!!! Por favor preencher o campo corretamente.`)
                CampoNomePessoa2.value = ""
                CampoNomePessoa2.focus()
                exit
            }else if (CampoIdadePessoa2.value.trim() == "") {
                alert(`Campo IDADE da Pessoa 2 está vázio!!! Por favor preencher. o campo corretamente`)
                CampoIdadePessoa2.value = ""
                CampoIdadePessoa2.focus()
                exit
            }else if (isNaN(CampoIdadePessoa2.value.trim())) {
                alert(`Campo IDADE da Pessoa 2 está com um valor que não é númerico!!! Por favor preencher o campo corretamente.`)
                CampoIdadePessoa2.value = ""
                CampoIdadePessoa2.focus()
                exit
            }else if (CampoIdadePessoa2.value.trim() <= 0) {
                alert(`Campo IDADE da Pessoa 2 está com um valor igual ou menor que zero!!! Por favor preencher o campo corretamente.`)
                CampoIdadePessoa2.value = ""
                CampoIdadePessoa2.focus()
                exit
            }else if (CampoIdadePessoa1.value.trim() > CampoIdadePessoa2.value.trim()) {
                //Pessoa 1 é mais velha
                msg = `A(o) ${CampoNomePessoa1.value.trim()} com a idade ${CampoIdadePessoa1.value.trim()} anos é o mais velho!`
            }else if (CampoIdadePessoa1.value.trim() < CampoIdadePessoa2.value.trim()) {
                //Pessoa 2 é mais velha
                msg = `A(o) ${CampoNomePessoa2.value.trim()} com a idade ${CampoIdadePessoa2.value.trim()} anos é o mais velho!`
            }else {
                //Ambas tem a mesma idade
                msg = `Ambos possuem a mesma idade.`
            }

            mensagem.innerHTML = msg
        })

    </script>
</body>

</html>
