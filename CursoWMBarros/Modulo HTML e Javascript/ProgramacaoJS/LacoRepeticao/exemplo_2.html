<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2 - Laço de repetição WHILE</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 2 - Laço de repetição WHILE</h2>
        <button type="submit" id="btn_jogar" class="btn success">Iniciar o jogo</button>
    </main>
    <script>

        const numeroSecreto = 7
        const btnJogar = document.querySelector("#btn_jogar")

        btnJogar.addEventListener("click", () => {
            let qtdTentativas = 0, palpite = 0
        
            while (palpite != numeroSecreto) {
                qtdTentativas++
                palpite = prompt("Qual o seu palpite ?")

                if (palpite == numeroSecreto) {
                    alert(`Acertou o número!!! Suas tentativas foram ${qtdTentativas}`)
                } else {
                    alert("Errou!!!")
                }
            }
        })
    </script>
</body>

</html>
