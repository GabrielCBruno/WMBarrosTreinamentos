<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 5 - Pedido de Bebida</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exercicio 5 - Pedido de Bebida</h2>
        <button type="submit" id="btn_escolher_bebida" class="btn success">Escolher bebida</button>
    </main>
    <script>
        const btnEscolherBebida = document.getElementById("btn_escolher_bebida")

        btnEscolherBebida.addEventListener("click", () => {
            let bebida

            do {
                bebida = prompt("Escolha uma dessas opções de bebidas: café, suco ou chá (Digite sem acento)")

               if (bebida == "cafe" || bebida == "suco" || bebida == "cha") {
                    alert(`Você escolheu [${bebida}]`)
               }

            }while (bebida != "cafe" && bebida != "suco" && bebida != "cha")
        })
    </script>
</body>

</html>
