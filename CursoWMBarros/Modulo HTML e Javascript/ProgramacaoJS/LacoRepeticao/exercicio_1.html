<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 -Laço de repetição FOR</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 1 -Laço de repetição FOR</h2>
        <div class="form-group">
            <label for="palpite">Palpite</label>
            <input type="text" id="palpite" placeholder="Digite o palpite...">
        </div>
        <button type="submit" id="btn_jogar" class="btn success">Repetir</button>
        <p id="msg"></p>
    </main>
    <script>

        const btnJogar = document.getElementById("btn_jogar")
        const msg = document.getElementById("msg")
        const campoPalpite = document.getElementById("palpite")
        const numeroSecreto = 10

        btnJogar.addEventListener("click", () => {
            let palpite = 0
            let tentativa = 0
        
            while (palpite != numeroSecreto) {
                palpite = campoPalpite.value

                if (palpite == numeroSecreto) {
                    msg.innerHTML = "Parabéns, você acertou!"
                } else {
                    msg.innerHTML = "Tente novamente!"
                    campoPalpite.value = ""
                    campoPalpite.focus()
                    break
                }
            }
        })

    </script>
</body>

</html>
