<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6 - Botão de Cálculo com parâmetro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header-main">
        <a href="index.html"> <h1>Lógica de programação com Javascript</h1></a>
    </header>

    <main class="main-content">
        <h2>Exercicio 6 - Botão de Cálculo com parâmetro</h2>
        
        <button type="button" class="btn success" onclick="somarComParametro(10.5)">Somar</button>
    </main>
    <script>
        function somarComParametro(n2) {
            const n1 = 20.5;
            alert("A soma entre o número um (" + n1 + ") + o número dois (" + n2 + ") é: " + (n1 + n2));
        }
    </script>
</body>
</html>
