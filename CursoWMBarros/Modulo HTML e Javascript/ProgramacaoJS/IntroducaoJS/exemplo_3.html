<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Praticas Javascript</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header-main">
        <a href="index.html"> <h1>Lógica de programação com Javascript</h1></a>
    </header>

    <main class="main-content">
        <h2>Exemplo 3 - Eventos em Javascript</h2>
        <div class="form-column-item">
            <div class="form-group">
                <label for="example3">Escolha uma opção</label>
                <select id="example3" onchange="mudarValorOpcao(this.value)">
                    <option value="A">Option 1</option>
                    <option value="B">Option 2</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn success" onclick="mostrarMensagem()" >Send</button>
    </main>
    <script>

        function mudarValorOpcao (valorSelecionado) {
            alert("Valor selecionado: " + valorSelecionado);
        }

        function mostrarMensagem () {
            alert("ola")
        }
        
    </script>
</body>
</html>
