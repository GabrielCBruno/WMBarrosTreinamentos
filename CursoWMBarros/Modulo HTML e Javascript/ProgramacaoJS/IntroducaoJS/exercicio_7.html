<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 7 - Selecao de Cor</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header-main">
        <a href="index.html"> <h1>Lógica de programação com Javascript</h1></a>
    </header>

    <main class="main-content">
        <h2>Exercicio 7 - Selecao de Cor</h2>
        
        <select id="select01" onchange="mudarCor(this.value)">
            <option value="Vermelho">Vermelho</option>
            <option value="Azul">Azul</option>
            <option value="Verde">Verde</option>
        </select>
    </main>
    <script>
        function mudarCor(corSelecionada) {
            alert("Você escolheu a cor: " + corSelecionada);
        }
    </script>
</body>
</html>
