<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 - Validar Formulário</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 1 - Validar Formulário</h2>
        <div class="form-group">
            <label for="nome_completo">Nome Completo</label>
            <input type="text" id="nome_completo" placeholder="Digite o seu nome aqui...">
        </div>
        <div class="form-group">
            <label for="email_usuario">Email</label>
            <input type="text" id="email_usuario" placeholder="Digite o seu email aqui...">
        </div>
        <div class="form-group">
            <label for="idade_usuario">Idade</label>
            <input type="text" id="idade_usuario" placeholder="Digite a sua idade aqui...">
        </div>
        <button type="submit" id="btn_mostrar" class="btn success">Enviar</button>
    </main>
    <script>
        const btnMostrar = document.getElementById("btn_mostrar")

        btnMostrar.addEventListener("click", () => {
            const campoNome = document.querySelector("#nome_completo")
            const nome = campoNome.value.trim()
            const campoEmail = document.getElementById("email_usuario")
            const email = campoEmail.value.trim()
            const campoIdade = document.getElementById("idade_usuario")
            const idade = campoIdade.value.trim()

            //função trim() remove os espaços antes e depois
            //propriedade value retorna o valor do campo HTML

            function isNumber(valor) {
                return !isNaN(valor)
            }
            
            if (isNumber(idade)) {
                alert(`Ok, o valor é um número!`)
            }

            if (nome == "") {
                alert("Preencha o campo NOME!!!")
                campoNome.value = ""
                campoNome.focus()
            } else if (email == "") {
                alert("Preencha o campo EMAIL!!!")
                campoEmail.value = ""
                campoEmail.focus()
            } else if (idade == "") {
                //Para numerico vazio é igual a zero
                campoIdade.value = ""
                campoIdade.focus()
                alert("Preencha o campo IDADE!!!")
            } else if (isNaN(idade)) {
                campoIdade.value = ""
                campoIdade.focus()
                alert("Preencher a idade com somente números!!!")
            } else {
                alert("Campos validados corretamente!!!")
            }
        })
    </script>
</body>

</html>
