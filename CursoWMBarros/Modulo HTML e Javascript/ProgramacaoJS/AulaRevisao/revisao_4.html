<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica de programação com JavaScript</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header-main">
        <a href="index.html">
            <h1>
                Módulo Extra - Atividades Práticas
            </h1>
        </a>
    </header>

    <main class="main-content">
        <h2>
            Validações de Campos
        </h2>
        <div class="cartao">
            1. Validar se os campos do formulário estão vazios ou preenchidos.
            <br>
            2. Validar se o valor dos campos numéricos são, de fato, números.
        </div>
        <h2>
            Formulário
        </h2>
        <div class="form-container">
            <form action="#">
                <div class="form-group">
                    <label for="campo_nome">Nome</label>
                    <input type="text" id="campo_nome" placeholder="Ex. Gabriel">
                </div>
                <div class="form-group">
                    <label for="campo_email">E-mail</label>
                    <input type="text" id="campo_email" placeholder="Ex. gabriel@gmail.com">
                </div>
                <div class="form-group">
                    <label for="campo_idade">Idade</label>
                    <input type="text" id="campo_idade" placeholder="Ex. 26">
                </div>
                <div class="form-group">
                    <label for="campo_sabor_sorvete">Qual sorvete você quer hoje?</label>
                    <select id="campo_sabor_sorvete">
                        <option value="">Selecione uma opção</option>
                        <option value="Chocolate">Sorvete de Chocolate</option>
                        <option value="Morango">Sorvete de Morango</option>
                        <option value="Baunilha">Sorvete de Baunilha</option>
                    </select>
                </div>
                <div class="button-group">
                    <button type="button" class="btn success" id="btn_validar_campos">Validar Campos</button>
                </div>
            </form>
        </div>

    </main>

    <script>
    </script>
</body>

</html>
